<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site en cours de construction</title>
  <style>
    /* Style général de la page */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f7f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Conteneur principal */
    .animation-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Base du chien */
    .chien {
      position: relative;
      width: 150px;
      height: 180px;
      margin-bottom: 20px;
    }

    /* Tête du chien */
    .tete {
      position: absolute;
      top: 30px;
      left: 35px;
      width: 80px;
      height: 80px;
      background: #d78e46; /* Couleur du pelage */
      border-radius: 50%;
      z-index: 10;
      animation: respiration 3s ease-in-out infinite;
    }

    /* Oreilles */
    .oreille {
      position: absolute;
      top: 25px;
      width: 25px;
      height: 50px;
      background: #b57230;
      border-radius: 20px 20px 50px 50px;
      z-index: 5;
    }
    .oreille-g { left: 25px; transform: rotate(15deg); }
    .oreille-d { right: 25px; transform: rotate(-15deg); }

    /* Yeux et animation clignement */
    .yeux {
      position: absolute;
      top: 30px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      padding: 0 15px;
      box-sizing: border-box;
    }
    .oeil {
      width: 10px;
      height: 10px;
      background: #2c3e50;
      border-radius: 50%;
      animation: clignement 4s linear infinite;
    }

    /* Truffe (Nez) */
    .truffe {
      position: absolute;
      top: 45px;
      left: 33px;
      width: 14px;
      height: 10px;
      background: #2c3e50;
      border-radius: 50% 50% 40% 40%;
    }

    /* Corps assis */
    .corps {
      position: absolute;
      bottom: 10px;
      left: 45px;
      width: 60px;
      height: 90px;
      background: #d78e46;
      border-radius: 30px 30px 20px 20px;
      z-index: 8;
      animation: respiration 3s ease-in-out infinite;
    }

    /* Pattes avant */
    .patte-avant {
      position: absolute;
      bottom: 0;
      left: 15px;
      width: 30px;
      height: 40px;
      background: #b57230;
      border-radius: 10px 10px 5px 5px;
      box-shadow: 15px 0 0 #b57230; /* Deuxième patte */
    }

    /* Queue et animation frétillement */
    .queue {
      position: absolute;
      bottom: 15px;
      right: 35px;
      width: 40px;
      height: 15px;
      background: #b57230;
      border-radius: 0 10px 10px 0;
      transform-origin: left center;
      animation: fretillement 0.6s ease-in-out infinite alternate;
    }

    /* Texte sous le chien */
    .message-attente {
      color: #555;
      font-weight: bold;
      font-size: 1.2rem;
      margin: 0;
    }

    /* --- KEYFRAMES DES ANIMATIONS --- */

    /* 1. Respiration */
    @keyframes respiration {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-4px) scaleY(1.02); }
    }

    /* 2. Clignement des yeux */
    @keyframes clignement {
      0%, 95%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.1); }
    }

    /* 3. Frétillement de la queue */
    @keyframes fretillement {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(20deg); }
    }
  </style>
</head>
<body>

  <div class="animation-container">
    <div class="chien">
      <div class="oreilles">
        <div class="oreille oreille-g"></div>
        <div class="oreille oreille-d"></div>
      </div>
      <div class="tete">
        <div class="yeux">
          <div class="oeil oeil-g"></div>
          <div class="oeil oeil-d"></div>
        </div>
        <div class="truffe"></div>
      </div>
      <div class="corps">
        <div class="patte-avant"></div>
      </div>
      <div class="queue"></div>
    </div>
    <p class="message-attente">Wouf... On peaufine les derniers détails !</p>
  </div>

</body>
</html>
