<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Futuriste</title>


<!-- Import police futuriste -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">


<!-- Import Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


<style>
body {
margin: 0;
padding: 0;
font-family: 'Orbitron', sans-serif;
background: #0a0f1d;
color: white;
overflow-x: hidden;
}
canvas {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
z-index: -1;
}
header {
text-align: center;
padding: 100px 20px;
}
h1 {
font-size: 3rem;
text-shadow: 0 0 15px #00f0ff;
animation: neonPulse 2s infinite alternate;
}
@keyframes neonPulse {
from { text-shadow: 0 0 5px #00f0ff; }
to { text-shadow: 0 0 25px #00e6b8; }
}
section {
max-width: 1000px;
margin: 80px auto;
padding: 40px;
background: rgba(255,255,255,0.05);
border-radius: 12px;
backdrop-filter: blur(6px);
opacity: 0;
transform: translateY(50px);
transition: all 0.9s ease;
}
section.show {
opacity: 1;
transform: translateY(0);
}
.card {
background: rgba(0,255,255,0.07);
padding: 20px;
margin: 15px 0;
border-radius: 8px;
cursor: pointer;
transition: transform .5s;
}
.card:hover {
transform: perspective(600px) rotateX(6deg) rotateY(-6deg) scale(1.03);
}
</style>
</head>
<body>


<canvas id="bg"></canvas>


<header>
<h1>Mon Portfolio Futuriste</h1>
<p>Développeur – Informatique – Innovation</p>
</header>


<section>
<h2>Présentation</h2>
<p>Bienvenue dans mon univers numérique futuriste !</p>
</section>


</html>
